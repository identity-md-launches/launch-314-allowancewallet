[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.26"
optimizer = true
optimizer_runs = 200
evm_version = "paris"
bytecode_hash = "none"
cbor_metadata = false
ffi = false
fs_permissions = []
verbosity = 2

[fuzz]
runs = 256

[invariant]
runs = 64
depth = 64
fail_on_revert = false

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
